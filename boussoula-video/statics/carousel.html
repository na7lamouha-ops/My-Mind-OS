<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../fonts/local.css">
<link rel="stylesheet" href="../fonts/hand.css">
<style>
/* أسلوب «ملف حالة» على الورق — مختلف تماماً على الفيديوهات (الداكنة) */
:root{--paper:#F4EEE2;--ink:#1d1b22;--mut:#5e5868;--red:#cf2f3d;--grn:#1d8a4b;--gold:#b98309;--blue:#2c62c9;--note:#FFE680;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--paper);font-family:'Tajawal','Noto Color Emoji',sans-serif;color:var(--ink);}
body{background-image:linear-gradient(rgba(60,90,160,.10) 2px,transparent 2px);background-size:100% 64px;background-position:0 40px;}
.margin{position:absolute;top:0;bottom:0;right:96px;width:3px;background:rgba(207,47,61,.35);}
.pg{position:absolute;inset:0;padding:120px 150px 150px 90px;}
.top{position:absolute;top:44px;right:150px;left:90px;display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:28px;color:var(--mut);}
.tab{background:var(--ink);color:var(--paper);padding:8px 22px;border-radius:10px 10px 0 0;font-size:28px;}
.foot{position:absolute;bottom:46px;right:150px;left:90px;display:flex;justify-content:space-between;align-items:center;font-size:28px;font-weight:900;color:var(--mut);}
.foot .sw{color:var(--ink);background:var(--note);padding:8px 20px;border-radius:8px;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.12);}
.h{font-family:'Ruqaa','Tajawal';font-weight:700;line-height:1.35;}
.h1{font-size:96px;} .h2{font-size:72px;} .h3{font-size:56px;}
.t{font-size:40px;font-weight:700;line-height:1.6;} .s{font-size:32px;color:var(--mut);font-weight:700;line-height:1.55;}
.mk{background:linear-gradient(transparent 55%,rgba(255,214,0,.75) 55%);padding:0 6px;}
.mkr{background:linear-gradient(transparent 55%,rgba(207,47,61,.28) 55%);padding:0 6px;}
.mkg{background:linear-gradient(transparent 55%,rgba(29,138,75,.25) 55%);padding:0 6px;}
.red{color:var(--red);} .grn{color:var(--grn);} .gold{color:var(--gold);} .blue{color:var(--blue);}
.pol{display:inline-block;background:#fff;padding:16px 16px 54px;box-shadow:0 14px 30px rgba(0,0,0,.18);position:relative;text-align:center;}
.pol .im{width:190px;height:190px;display:flex;align-items:center;justify-content:center;font-size:110px;}
.pol b{position:absolute;bottom:10px;left:0;right:0;font-family:'Ruqaa';font-size:40px;}
.pol:before{content:"";position:absolute;top:-18px;left:50%;width:120px;height:36px;margin-left:-60px;background:rgba(255,230,128,.85);transform:rotate(-4deg);}
.im.r{background:linear-gradient(135deg,#ffc2cc,#ff4d6a);} .im.g{background:linear-gradient(135deg,#a7f3c4,#22c55e);} .im.b{background:linear-gradient(135deg,#cfe3ff,#5aa2ff);} .im.o{background:linear-gradient(135deg,#ffd1a3,#ff7a45);} .im.y{background:linear-gradient(135deg,#FDE68A,#F5C542);} .im.k{background:linear-gradient(135deg,#e5e5ea,#8e8e9a);}
.stamp{display:inline-block;font-family:'Ruqaa';font-size:52px;border:6px solid currentColor;border-radius:14px;padding:4px 26px;transform:rotate(-8deg);opacity:.88;}
.note{background:var(--note);padding:26px 30px;box-shadow:0 12px 26px rgba(0,0,0,.15);font-size:38px;font-weight:900;line-height:1.5;}
.card{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px 26px;font-size:38px;font-weight:700;box-shadow:8px 8px 0 var(--ink);}
.row{display:flex;gap:22px;align-items:center;}
.tl{display:flex;flex-direction:column;gap:18px;}
.tl .e{display:flex;gap:20px;align-items:flex-start;}
.tl .e i{font-style:normal;flex:0 0 auto;font-size:30px;font-weight:900;background:var(--ink);color:var(--paper);border-radius:10px;padding:6px 14px;direction:ltr;margin-top:6px;}
.tl .e div{font-size:38px;font-weight:900;line-height:1.4;} .tl .e span{display:block;font-size:30px;color:var(--mut);font-weight:700;}
.kp{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.kp div{background:#fff;border:2px dashed rgba(0,0,0,.25);border-radius:14px;padding:14px 18px;font-size:30px;font-weight:700;color:var(--mut);}
.kp b{display:block;font-size:46px;color:var(--ink);font-weight:900;}
table{border-collapse:collapse;width:100%;font-size:34px;font-weight:900;background:#fff;}
td,th{border:3px solid var(--ink);padding:16px 12px;text-align:center;}
th{font-family:'Ruqaa';font-size:42px;}
.dlg{display:flex;flex-direction:column;gap:22px;}
.dlg p{font-size:38px;font-weight:700;line-height:1.55;} .dlg p b{font-family:'Ruqaa';font-size:42px;margin-left:10px;}
.dlg .dir{font-size:30px;color:var(--mut);font-style:italic;}
.arrow{font-size:44px;text-align:center;color:var(--mut);line-height:1;}
.disc{position:absolute;bottom:104px;right:150px;left:90px;font-size:24px;color:var(--mut);font-weight:700;text-align:center;}
.box{border:5px dashed var(--ink);border-radius:20px;}
.ctab{display:inline-block;background:var(--ink);color:#F5C542;font-size:42px;font-weight:900;padding:24px 40px;border-radius:24px;box-shadow:8px 8px 0 #F5C542;}
</style>
</head>
<body>

  ()=>`<div class="h h2" style="margin-top:20px">قواعد اللعبة:</div>
   <div class="card" style="margin-top:40px"><div class="tl">${[['الهدف قبل السلعة','شحال، وفي قداش من وقت'],['الحساب قبل الصرف','رأس المال، الستوك، يوم رجوع الكاش'],['الخطة تتحسب على أسوأ أسبوع','ماشي على أحسن واحد'],['المعيار: الكاش اللي يرجع','ماشي عدد الطلبيات']].map((r,i)=>`<div class="e"><i>☐ ${i+1}</i><div>${r[0]}<span>${r[1]}</span></div></div>`).join('')}</div></div>`,
  ()=>`<div style="position:relative;height:560px;margin-top:40px"><div class="box" style="position:absolute;right:120px;top:60px;width:420px;height:420px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--mut);text-align:center">«ازدم ساهلة»<br>«منتج ← إعلان»</div>
   <div style="position:absolute;left:30px;top:150px">${pol('🤔','k','ترابينكو',-6)}</div></div>
   <div class="h h1">بدا يشوف<br><span class="mk">من برّا الصندوق.</span></div>`,
  ()=>`<div class="h h2" style="margin-top:40px">وشاف حكاية لينا، إلياس،<br>وعبد الرحمان…</div>
   <div class="row" style="margin-top:50px;justify-content:center;gap:40px">${pol('🏃','r','إلياس',-5)}${pol('😮‍💨','b','عبد الرحمان',3)}${pol('🧭','g','لينا',-2)}</div>
   <div class="note" style="margin-top:50px;transform:rotate(-1.5deg)">نفس الهدف، 3 طرق… <span class="mk">ووحدة برك وصلت مرتاحة.</span></div>`,
  ()=>`<div class="h h1" style="margin-top:110px">واللي ما شافهاش؟</div>
   <div class="t" style="margin-top:30px">راهي في <b>دراسة الحالة #1</b> 👆<br>(أول كاروسيل في الصفحة)</div>
   <div style="margin-top:80px;text-align:center"><div class="ctab">🧭 اعرف القواعد — مجاناً</div><div class="s" style="margin-top:22px">الرابط في البيو 👆</div></div>`]},
};
const car=CAR[C], tot=car.slides.length;
document.getElementById('root').innerHTML=`<div class="top"><span class="tab">${car.tab}</span><span>${N}/${tot}</span></div><div class="pg">${car.slides[N-1]()}</div><div class="disc">${car.d}</div><div class="foot"><span>🧭 البوصلة · Na7la</span>${N<tot?'<span class="sw">اسحب ⬅️</span>':''}</div>`;
window.TOT=tot; document.fonts.ready.then(()=>window.READY=true);
</script>
