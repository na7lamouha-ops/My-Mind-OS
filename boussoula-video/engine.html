<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="fonts/local.css">
<style>
:root{--bg:#08080c;--card:#14141b;--txt:#f0f0f5;--mut:#a9a7b4;--gold:#F5C542;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:1080px;height:1920px;overflow:clip;background:var(--bg);font-family:'Tajawal','Noto Color Emoji',sans-serif;color:var(--txt);}
#stage{position:fixed;inset:0;overflow:hidden;contain:paint;}
#grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1.6px,transparent 1.7px);background-size:44px 44px;}
#tint{position:absolute;inset:0;}
#vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,transparent 40%,rgba(0,0,0,.7) 100%);pointer-events:none;}
.sc{position:absolute;inset:0;opacity:0;visibility:hidden;}
.it{position:absolute;opacity:0;}
.tx{left:140px;right:140px;text-align:center;font-weight:900;line-height:1.35;}
.tx.big{font-size:84px;} .tx.mid{font-size:54px;} .tx.sm{font-size:38px;font-weight:700;color:var(--mut);line-height:1.5;} .tx.xs{font-size:34px;font-weight:700;color:var(--mut);line-height:1.5;}
.gold{color:var(--gold);} .red{color:#ff9aab;} .grn{color:#7ef0a8;} .blu{color:#9cc7ff;} .org{color:#ffc7a8;} .wht{color:#fff;}
.av{width:200px;height:200px;margin-left:-100px;text-align:center;}
.av .c{width:200px;height:200px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:100px;box-shadow:0 18px 50px rgba(0,0,0,.5);}
.av b{display:block;font-size:46px;font-weight:900;margin-top:16px;white-space:nowrap;} .av span{display:block;font-size:32px;color:var(--mut);font-weight:700;margin-top:4px;white-space:nowrap;}
.g-green{background:linear-gradient(135deg,#a7f3c4,#22c55e);} .g-red{background:linear-gradient(135deg,#ffc2cc,#ff4d6a);} .g-blue{background:linear-gradient(135deg,#cfe3ff,#5aa2ff);} .g-orange{background:linear-gradient(135deg,#ffd1a3,#ff7a45);} .g-gold{background:linear-gradient(135deg,#FDE68A,#F5C542);} .g-gray{background:linear-gradient(135deg,#e5e5ea,#8e8e9a);}
.chat{left:140px;right:140px;}
.bub{font-size:38px;font-weight:700;line-height:1.5;padding:20px 28px;border-radius:30px;margin-bottom:22px;opacity:0;max-width:720px;}
.bub.r{background:#1d1d27;border:1px solid rgba(255,255,255,.12);margin-left:auto;border-top-right-radius:8px;}
.bub.l{background:rgba(34,197,94,.16);border:1px solid rgba(34,197,94,.45);margin-right:auto;border-top-left-radius:8px;color:#d8fbe5;}
.bub small{display:block;font-size:28px;color:var(--mut);font-weight:900;margin-bottom:4px;}
.flow{left:120px;right:120px;display:flex;justify-content:center;gap:22px;}
.fn{flex:1;max-width:270px;min-height:160px;border-radius:24px;background:var(--card);border:2px solid rgba(34,197,94,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;padding:12px 8px;text-align:center;}
.fn i{font-style:normal;font-size:52px;} .fn b{font-size:34px;margin-top:6px;} .fn span{font-size:28px;color:var(--mut);font-weight:700;}
.split{left:120px;right:120px;display:flex;gap:22px;}
.sp{flex:1;border-radius:26px;padding:24px 18px;opacity:0;}
.sp h3{font-size:44px;font-weight:900;text-align:center;} .sp .s{font-size:30px;color:var(--mut);text-align:center;font-weight:700;margin:4px 0 12px;}
.sp .r{display:flex;justify-content:space-between;gap:8px;font-size:34px;padding:14px 0;border-top:1px solid rgba(255,255,255,.08);font-weight:700;color:#cfcdd8;} .sp .r b{color:#fff;white-space:nowrap;}
.sp.good{background:rgba(34,197,94,.09);border:3px solid rgba(34,197,94,.55);} .sp.bad{background:rgba(255,77,106,.09);border:3px solid rgba(255,77,106,.5);} .sp.mid{background:rgba(90,162,255,.09);border:3px solid rgba(90,162,255,.5);}
.list{left:140px;right:140px;}
.li{display:flex;align-items:center;gap:20px;background:var(--card);border:2px solid rgba(245,197,66,.35);border-radius:22px;padding:20px 24px;margin-bottom:18px;font-size:34px;font-weight:900;opacity:0;}
.li i{flex:0 0 58px;height:58px;border-radius:14px;border:2px solid var(--gold);color:var(--gold);font-style:normal;display:flex;align-items:center;justify-content:center;font-size:30px;}
.li span{display:block;font-size:30px;color:var(--mut);font-weight:700;margin-top:2px;}
.icons{left:120px;right:120px;display:flex;justify-content:center;gap:40px;}
.ic{width:220px;text-align:center;opacity:0;} .ic i{font-style:normal;display:block;font-size:110px;} .ic b{display:block;font-size:36px;font-weight:900;margin-top:10px;}
.prod{left:120px;right:120px;display:flex;justify-content:center;gap:24px;}
.pc{flex:1;max-width:340px;height:420px;border-radius:14px 6px 6px 14px;background:linear-gradient(200deg,#2a2112,#0a0906);border:2px solid rgba(245,197,66,.55);box-shadow:inset -10px 0 0 rgba(245,197,66,.8),0 18px 40px rgba(0,0,0,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 26px 20px 14px;opacity:0;}
.pc i{font-style:normal;font-size:80px;} .pc b{font-size:40px;font-weight:900;color:var(--gold);margin-top:12px;line-height:1.25;} .pc span{font-size:30px;color:#e8e6ef;margin-top:10px;font-weight:700;line-height:1.4;}
svg.chart{direction:ltr;left:90px;width:900px;height:560px;overflow:visible;}
.meter{left:200px;right:200px;}
.meter .lb{display:flex;justify-content:space-between;font-size:30px;font-weight:900;margin-bottom:12px;} .meter .tr{height:24px;border-radius:14px;background:rgba(255,255,255,.08);overflow:hidden;} .meter .fl{height:100%;width:0;border-radius:14px;}
.cta{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 40%,#1a1508 0%,#08080c 70%);}
.cta .brand{font-size:84px;font-weight:900;color:var(--gold);margin-top:26px;} .cta .tag{font-size:36px;color:#e8e6ef;margin-top:12px;font-weight:700;padding:0 120px;line-height:1.5;}
.cta .btn{margin-top:46px;background:linear-gradient(135deg,#FDE68A,#F5C542,#B8860B);color:#1a1408;font-size:42px;font-weight:900;padding:26px 48px;border-radius:30px;box-shadow:0 20px 50px rgba(245,197,66,.35);}
.cta .url{margin-top:30px;font-size:34px;color:#cfcdd8;font-weight:700;direction:ltr;} .cta .bio{margin-top:14px;font-size:36px;color:var(--gold);font-weight:900;}
.disc{position:absolute;top:1420px;left:140px;right:140px;text-align:center;font-size:30px;color:#c9c7d4;font-weight:700;line-height:1.5;opacity:0;}
.race{left:0;right:0;top:0;height:1920px;}
.fuel{position:absolute;width:270px;text-align:center;font-size:30px;font-weight:900;}
.fuel .tr{height:24px;border-radius:10px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px;} .fuel .fl{height:100%;border-radius:10px;}
.stk{position:relative;display:inline-block;} .stk>i{position:absolute;right:-6px;top:50%;height:9px;margin-top:-4px;background:#ff4d6a;border-radius:5px;width:0;box-shadow:0 0 14px rgba(255,77,106,.7);}
.cn{left:60px;right:60px;text-align:center;font-weight:900;line-height:1.1;} .cn .n{display:inline-block;direction:ltr;} .cn .cl{font-size:36px;color:var(--mut);font-weight:700;margin-top:14px;line-height:1.4;}
.ph{left:220px;width:640px;height:950px;border-radius:64px;background:#0f0f15;border:3px solid rgba(255,255,255,.16);box-shadow:0 30px 90px rgba(0,0,0,.7),inset 0 0 0 10px #050508;overflow:hidden;}
.ph .hd{position:absolute;top:28px;left:0;right:0;height:84px;display:flex;align-items:center;justify-content:center;gap:16px;font-size:34px;font-weight:900;border-bottom:1px solid rgba(255,255,255,.08);}
.ph .bd{background:#ff3b5c;color:#fff;border-radius:30px;padding:2px 16px;font-size:30px;min-width:60px;text-align:center;direction:ltr;}
.ph .nt{position:absolute;left:24px;right:24px;height:118px;border-radius:26px;background:#1c1c26;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:18px;padding:0 22px;opacity:0;}
.ph .nt i{font-style:normal;font-size:52px;flex:0 0 64px;text-align:center;} .ph .nt b{display:block;font-size:31px;} .ph .nt span{display:block;font-size:27px;color:var(--mut);font-weight:700;margin-top:2px;}
.tl{left:90px;right:90px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.tile{height:190px;border-radius:24px;background:var(--card);border:2px solid rgba(245,197,66,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 12px;opacity:0;}
.tile b{font-size:46px;color:var(--gold);font-weight:900;line-height:1;} .tile span{font-size:30px;font-weight:900;margin-top:10px;line-height:1.25;}
.tml{left:140px;right:140px;} .tml .bar{position:relative;height:40px;border-radius:20px;background:rgba(255,255,255,.08);}
.tml .fr{position:absolute;right:0;top:0;bottom:0;border-radius:20px;background:linear-gradient(270deg,#ff4d6a,#ff9f43);} .tml .pin{position:absolute;top:-118px;transform:translateX(50%);text-align:center;font-size:36px;font-weight:900;white-space:nowrap;}
.tml .pin:after{content:"";display:block;width:6px;height:70px;margin:8px auto 0;background:var(--gold);border-radius:3px;}
.tml .tk{position:absolute;top:58px;font-size:30px;color:var(--mut);font-weight:900;transform:translateX(50%);white-space:nowrap;}
.tml .ok{margin-top:120px;text-align:center;font-size:44px;font-weight:900;color:#7ef0a8;opacity:0;}
.li.lock>div{filter:blur(9px);opacity:.75;} .li.lock em{font-style:normal;margin-right:auto;flex:0 0 auto;font-size:28px;font-weight:900;color:var(--gold);border:2px solid rgba(245,197,66,.5);border-radius:30px;padding:6px 16px;white-space:nowrap;}
#badge{position:absolute;top:236px;left:0;right:0;text-align:center;opacity:0;}
#badge span{display:inline-block;font-size:30px;font-weight:900;color:var(--gold);border:2px solid rgba(245,197,66,.5);background:rgba(20,18,10,.7);border-radius:40px;padding:8px 26px;}
.q{display:inline-block;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:28px;padding:14px 30px;}
</style>
</head>
<body>
<div id="grid"></div><div id="tint"></div>
<div id="stage"></div>
<div class="disc" id="disc"></div><div id="badge"></div>
<div id="vign"></div>
<script>
const P=new URLSearchParams(location.search); const NAME=P.get('v');
document.write(`<script src="videos/${NAME}.js"><\/script>`);
</script>
<script>
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=x=>1-Math.pow(1-clamp(x),3), easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const NS='http://www.w3.org/2000/svg';

const TINT={green:'rgba(34,197,94,.13)',red:'rgba(255,77,106,.13)',blue:'rgba(90,162,255,.11)',orange:'rgba(255,122,69,.12)',gold:'rgba(245,197,66,.10)',none:'rgba(0,0,0,0)'};
let T0=0; const SC=[]; const anims=[];
function logo(sz){ return `<svg width="${sz}" height="${sz}" viewBox="0 0 130 130"><defs><linearGradient id="lg${Math.random().toString(36).slice(2,6)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF1B8"/><stop offset=".4" stop-color="#F5C542"/><stop offset="1" stop-color="#A8750A"/></linearGradient></defs><polygon points="65,12 110.9,38.5 110.9,91.5 65,118 19.1,91.5 19.1,38.5" fill="#100f16" stroke="#F5C542" stroke-width="4" stroke-linejoin="round"/><g class="needle" style="transform-origin:65px 65px"><polygon points="65,27 58.5,65 71.5,65" fill="#F5C542"/><polygon points="65,103 58.5,65 71.5,65" fill="#26242e" stroke="#F5C542" stroke-width=".9"/></g><polygon points="65,58.5 70.6,61.75 70.6,68.25 65,71.5 59.4,68.25 59.4,61.75" fill="#F5C542"/></svg>`; }
function pop(el,k,dy=30){ el.style.opacity=ease(k); el.style.transform=`translateY(${(1-ease(k))*dy}px) scale(${0.92+0.08*back(k)})`; }
V.scenes.forEach((s,si)=>{
  const d=document.createElement('div'); d.className='sc'; stage.appendChild(d);
  const sc={el:d,a:T0,b:T0+s.d,tint:s.tint||'none',disc:s.disc,items:[]};
  (s.items||[]).forEach(it=>{
    const e=document.createElement('div'); e.className='it'; d.appendChild(e); const at=it.at||0; const o={it,e,at};
    if(it.type==='text'){ e.classList.add('tx',it.size||'mid'); if(it.color) e.classList.add(it.color); e.style.top=(it.y+(V.yoff||0))+'px'; e.innerHTML=it.strike!=null?`<span class="stk">${it.t}<i></i></span>`:it.t; if(it.static) o.static=true; }
    else if(it.type==='counter'){ e.classList.add('cn'); if(it.color) e.classList.add(it.color); e.style.top=(it.y+(V.yoff||0))+'px'; e.innerHTML=`<div style="font-size:${it.size||150}px">${it.pre||''}<span class="n"></span>${it.suf||''}</div>${it.label?`<div class="cl">${it.label}</div>`:''}`; }
    else if(it.type==='phone'){ e.classList.add('ph'); e.style.top=(it.y+(V.yoff||0))+'px'; e.innerHTML=`<div class="hd">${it.head||''}${it.badge?'<span class="bd">0</span>':''}</div>`+it.notifs.map(n=>`<div class="nt"><i>${n.i}</i><div><b>${n.t}</b>${n.s?`<span>${n.s}</span>`:''}</div></div>`).join(''); o.nts=[...e.querySelectorAll('.nt')]; }
    else if(it.type==='tiles'){ e.classList.add('tl'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.list.map((x,i)=>`<div class="tile"><b>${i+1}</b><span>${x}</span></div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.3; }

    else if(it.type==='avatar'){ e.classList.add('av'); e.style.left=it.x+'px'; e.style.top=(it.y+(V.yoff||0))+'px'; e.innerHTML=`<div class="c g-${it.g}" style="${it.small?'width:150px;height:150px;font-size:76px;margin:0 auto':''}">${it.emoji}</div><b class="${it.nc||''}">${it.name}</b>${it.sub?`<span>${it.sub}</span>`:''}`; }
    else if(it.type==='chat'){ e.classList.add('chat'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.list.map(b=>`<div class="bub ${b.side||'r'}">${b.who?`<small>${b.who}</small>`:''}${b.t}</div>`).join(''); o.kids=[...e.children]; o.times=it.list.map(b=>b.at); o.scroll=it.scroll; }
    else if(it.type==='flow'){ e.classList.add('flow'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.nodes.map(n=>`<div class="fn" style="${n.c?`border-color:${n.c}`:''}"><i>${n.i}</i><b>${n.b}</b>${n.s?`<span>${n.s}</span>`:''}</div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.7; }
    else if(it.type==='split'){ e.classList.add('split'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.cols.map(c=>`<div class="sp ${c.k}"><h3>${c.h}</h3>${c.s?`<div class="s">${c.s}</div>`:''}${(c.rows||[]).map(r=>`<div class="r"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.6; }
    else if(it.type==='list'){ e.classList.add('list'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.rows.map((r,i)=>`<div class="li${r.lock?' lock':''}"><i>${r.n||i+1}</i><div>${r.t}${r.s?`<span>${r.s}</span>`:''}</div>${r.lock?`<em>${r.lock===true?'🔒 في المتقدم':r.lock}</em>`:''}</div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.6; }
    else if(it.type==='icons'){ e.classList.add('icons'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; if(it.compact){ e.style.gap='18px'; } e.innerHTML=it.list.map(x=>`<div class="ic" style="${it.compact?'width:190px':''}"><i style="${it.compact?'font-size:90px':''}">${x[0]}</i><b>${x[1]}</b></div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.5; }
    else if(it.type==='products'){ e.classList.add('prod'); e.style.top=(it.y+(V.yoff||0))+'px'; e.style.opacity=1; e.innerHTML=it.list.map(x=>`<div class="pc"><i>${x.i}</i><b>${x.b}</b><span>${x.s}</span></div>`).join(''); o.kids=[...e.children]; o.step=it.step||0.7; }
    else if(it.type==='meter'){ e.classList.add('meter'); e.style.top=(it.y+(V.yoff||0))+'px'; e.innerHTML=`<div class="lb"><span>${it.label}</span><span class="pc" style="${it.nopc?'display:none':''}">0%</span></div><div class="tr"><div class="fl" style="background:${it.color}"></div></div>`; }
    else if(it.type==='zigzag'||it.type==='decline'||it.type==='steady'){ const s2=document.createElementNS(NS,'svg'); s2.setAttribute('viewBox','0 0 900 560'); s2.classList.add('chart'); s2.style.top=(it.y+(V.yoff||0))+'px'; e.replaceWith(s2); o.e=s2; s2.classList.add('it');
      if(it.type==='zigzag'){ const pts=[[0,300],[80,170],[150,330],[230,150],[300,360],[380,190],[450,350],[540,170],[610,370],[700,200],[780,340],[880,250]]; s2.innerHTML=`<line x1="0" y1="300" x2="900" y2="300" stroke="rgba(255,255,255,.25)" stroke-width="3" stroke-dasharray="10 10"/><path d="M${pts.map(p=>p.join(',')).join(' L')}" fill="none" stroke="${it.c||'#ff7a45'}" stroke-width="10" stroke-linejoin="round" stroke-linecap="round"/>${it.label?`<text x="450" y="520" text-anchor="middle" font-size="30" font-weight="900" fill="#e8e6ef" font-family="Tajawal">${it.label}</text>`:''}`; }
      if(it.type==='decline'){ s2.innerHTML=`<path d="M0,60 C200,90 380,200 520,330 S800,520 900,560" fill="none" stroke="#ff4d6a" stroke-width="10" stroke-linecap="round"/><path d="M0,420 C250,400 500,330 900,200" fill="none" stroke="#F5C542" stroke-width="10" stroke-linecap="round"/><text x="20" y="40" font-size="34" font-weight="900" fill="#ff9aab" font-family="Tajawal">${it.a||'الفرصة السهلة'}</text><text x="890" y="170" text-anchor="end" font-size="34" font-weight="900" fill="#F5C542" font-family="Tajawal">${it.b||'القواعد الصحيحة'}</text><text x="0" y="610" font-size="28" fill="#a9a7b4" font-weight="700" font-family="Tajawal">${it.x0||'2021'}</text><text x="900" y="610" text-anchor="end" font-size="28" fill="#a9a7b4" font-weight="700" font-family="Tajawal">${it.x1||'اليوم →'}</text>`; }
      o.paths=[...s2.querySelectorAll('path')].map(p=>{ const L=p.getTotalLength(); p.style.strokeDasharray=L; p.style.strokeDashoffset=L; return {p,L}; });
    }

    else if(it.type==='cta'){ e.classList.add('cta'); e.innerHTML=`${logo(210)}<div class="brand">${it.brand||'بوصلة التاجر'}</div><div class="tag">${it.tag||''}</div><div class="btn">${it.btn||'🎁 هديتين مجانيتين: الكتاب + البوصلة'}</div><div class="url">${it.url||'al-khaliya.space/start.html'}</div><div class="bio">${it.bio||'مجاناً — الرابط في البيو 👆'}</div>`; }
    sc.items.push(o);
  });
  SC.push(sc); T0+=s.d;
});
const DUR=T0;
function buildRace(e,it,o){
  const s=document.createElementNS(NS,'svg'); s.setAttribute('viewBox','0 0 1080 1920'); s.style.cssText='position:absolute;inset:0;width:1080px;height:1920px;direction:ltr'; e.appendChild(s);
  const dest=[540,360];
  const P=[ 'M540,1380 C540,1100 540,700 540,420',
            'M540,1380 C760,1250 860,1150 820,1000 C780,860 560,980 420,880 C260,760 300,640 470,600 C620,560 640,470 560,420',
            'M540,1380 C320,1280 200,1180 240,1030 C290,860 520,940 640,820 C760,700 820,820 700,900 C600,960 420,900 380,760' ];
  s.innerHTML=`<g id="rg" transform="translate(162,120) scale(0.7)"><circle cx="${dest[0]}" cy="${dest[1]-20}" r="70" fill="rgba(245,197,66,.15)" stroke="#F5C542" stroke-width="4"/><text x="${dest[0]}" y="${dest[1]-2}" text-anchor="middle" font-size="64">🏁</text><text x="${dest[0]}" y="${dest[1]-110}" text-anchor="middle" font-size="44" font-weight="900" fill="#F5C542" font-family="Tajawal">${it.dest||'النجاح'}</text>`+
   P.map((d,i)=>`<path d="${d}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="26" stroke-linecap="round"/><path class="rp" d="${d}" fill="none" stroke="${['#22c55e','#ff9f43','#ff4d6a'][i]}" stroke-width="8" stroke-linecap="round" stroke-dasharray="2 22"/>`).join('')+'</g>';
  const paths=[...s.querySelectorAll('.rp')].map(p=>({p,L:p.getTotalLength()}));
  const g=s.querySelector('#rg'); const cars=['🚙','🚕','🚗'].map((c,i)=>{ const t=document.createElementNS(NS,'text'); t.setAttribute('font-size','90'); t.setAttribute('text-anchor','middle'); t.textContent=c; g.appendChild(t); return t; });
  const fuels=[0,1,2].map(i=>{ const f=document.createElement('div'); f.className='fuel'; f.style.left=[50+i*0,0,0][i]+'px'; f.innerHTML=`<span>${['🚙 1','🚕 2','🚗 3'][i]} ⛽ <b class="v">100%</b></span><div class="tr"><div class="fl"></div></div>`; e.appendChild(f); return f; });
  fuels.forEach((f,i)=>{ f.style.top='1110px'; f.style.left=(770-i*300)+'px'; });
  o.race={paths,cars,fuels,cfg:it.cars};
}
function raceUpdate(o,lt){
  const {paths,cars,fuels,cfg}=o.race;
  cfg.forEach((c,i)=>{ const k=easeIO(seg(lt,c.start,c.start+c.dur)); const stopAt=c.stop||1; const prog=Math.min(k,stopAt); const pt=paths[i].p.getPointAtLength(paths[i].L*prog); const pt2=paths[i].p.getPointAtLength(Math.min(paths[i].L, paths[i].L*prog+4));
    cars[i].setAttribute('x',pt.x); cars[i].setAttribute('y',pt.y+26); const ang=Math.atan2(pt2.y-pt.y,pt2.x-pt.x)*180/Math.PI;
    const fuel = 100 - (100-c.fuelEnd)*(prog/stopAt); const fl=fuels[i].querySelector('.fl'); fl.style.width=fuel+'%'; fl.style.background= fuel>50?'#22c55e':(fuel>20?'#ff9f43':'#ff4d6a'); fuels[i].querySelector('.v').textContent=Math.round(fuel)+'%';
    const shake = (k>=stopAt && c.stop) ? Math.sin(lt*30)*3 : 0; cars[i].setAttribute('transform',`translate(${shake},0)`);
    paths[i].p.style.opacity = lt>=c.start-0.2 ? 1 : 0.15; cars[i].style.opacity= lt>=c.start-0.3?1:0.35; });
}
window.render=function(t){
  document.getElementById('grid').style.backgroundPosition=`${(t*6)%44}px ${(t*9)%44}px`;
  let tint='none', disc=0, discT='';
  SC.forEach((sc,si)=>{ const first=si===0; const FI=V.fast?0.1:0.35, FO=V.fast?0.1:0.3; const o=(first?1:seg(t,sc.a,sc.a+FI))*(1-seg(t,sc.b-FO,sc.b)); if(V.fast) sc.el.style.transform=`scale(${1+0.07*(1-ease(seg(t,sc.a,sc.a+0.35)))})`; sc.el.style.opacity=o; sc.el.style.visibility=o>0?'visible':'hidden';
    if(t>=sc.a && t<sc.b){ tint=sc.tint; if(sc.disc){ disc=seg(t,sc.a+0.3,sc.a+0.7)*(1-seg(t,sc.b-0.3,sc.b))*(sc.disc.o||1); discT=sc.disc.t||V.disc; } }
    if(o<=0) return; const lt=t-sc.a;
    sc.items.forEach(x=>{ const it=x.it, e=x.e;
      if(x.static){ e.style.opacity=1; e.style.transform=`scale(${1+0.02*Math.sin(t*3)})`; return; }
      const k=seg(lt,x.at,x.at+0.45); const fade= it.until? (1-seg(lt,it.until,it.until+0.3)) : 1;
      if(['text','avatar','meter'].includes(it.type) && !it.slam){ pop(e,k, it.type==='avatar'?0:30); if(it.type==='avatar'){ e.style.transform=`scale(${0.5+0.5*back(seg(lt,x.at,x.at+0.5))})`; } }
      if(it.until && ['text','avatar'].includes(it.type)) e.style.opacity=(+e.style.opacity)*fade;
      if(it.type==='meter'){ const v=it.from+(it.to-it.from)*easeIO(seg(lt,it.at+0.3,it.at+(it.dur||3))) + (it.jitter? Math.sin(t*9)*it.jitter*seg(lt,it.at+1,it.at+2):0); e.querySelector('.fl').style.width=clamp(v,0,100)+'%'; e.querySelector('.pc').textContent=Math.round(clamp(v,0,100))+'%'; }
      if(x.kids){ x.kids.forEach((c,i)=>{ const a = x.times? x.times[i] : x.at+i*x.step; const kk=seg(lt,a,a+0.45); c.style.opacity=ease(kk); c.style.transform=`translateY(${(1-ease(kk))*24}px) scale(${0.94+0.06*back(kk)})`; }); if(x.scroll){ const sc2=easeIO(seg(lt,x.scroll.at,x.scroll.at+0.6)); e.style.transform=`translateY(${-x.scroll.by*sc2}px)`; x.kids.forEach((c,i)=>{ if(i<x.scroll.hide) c.style.opacity=(+c.style.opacity)*(1-sc2); }); } }
      if(x.paths){ e.style.opacity=seg(lt,x.at,x.at+0.3); x.paths.forEach((p,i)=>{ p.p.style.strokeDashoffset=p.L*(1-easeIO(seg(lt,x.at+i*0.8,x.at+i*0.8+(it.dur||3)))); }); }
      if(it.slam && it.type==='text'){ const ks=seg(lt,x.at,x.at+0.22); e.style.opacity=clamp(ks*4)*fade; e.style.transform=`scale(${1+0.7*(1-ease(ks))}) rotate(${it.rot||0}deg)`; }
      if(it.strike!=null){ const ss=ease(seg(lt,it.strike,it.strike+0.3)); const ln=e.querySelector('.stk>i'); ln.style.width=(ss*100+ (ss>0?3:0))+'%'; if(ss>0) e.style.opacity=(+e.style.opacity)*(1-0.45*ss); }
      if(it.type==='counter'){ pop(e,k,20); if(it.slam){ e.style.transform=`scale(${1+0.5*(1-ease(seg(lt,x.at,x.at+0.25)))})`; } const kv=it.dur? easeIO(seg(lt,x.at+0.15,x.at+0.15+it.dur)) : 1; const v=(it.from||0)+(it.to-(it.from||0))*kv; e.querySelector('.n').textContent=v.toLocaleString('en-US',{minimumFractionDigits:it.dec||0,maximumFractionDigits:it.dec||0}); if(it.until) e.style.opacity=(+e.style.opacity)*fade; if(it.pulse && kv>=1) e.style.transform=`scale(${1+0.03*Math.sin(t*6)})`; }
      if(it.type==='phone'){ pop(e,k,60); const N=x.nts.length, H=134; x.nts.forEach((n,i)=>{ const a=it.notifs[i].at; const kk=seg(lt,a,a+0.28); let slot=0; for(let j=i+1;j<N;j++) slot+=ease(seg(lt,it.notifs[j].at,it.notifs[j].at+0.28)); n.style.top=(140+slot*H)+'px'; n.style.opacity=ease(kk)*(1-clamp(slot-5.2)); n.style.transform=`translateX(${(1-ease(kk))*-80}px) scale(${0.9+0.1*back(kk)})`; }); if(it.badge){ const bv=Math.round(it.badge.from+(it.badge.to-it.badge.from)*seg(lt,it.badge.at,it.badge.at+it.badge.dur)); e.querySelector('.bd').textContent=bv; } }
      if(it.type==='timeline'){ pop(e,k,20); const kd=easeIO(seg(lt,x.at+0.4,x.at+0.4+(it.dur||3))); const day=1+(it.mark-1)*kd; const p=x.px(day); e.querySelector('.fr').style.width=p+'px'; const pin=e.querySelector('.pin'); pin.style.right=p+'px'; pin.querySelector('.dn').textContent=it.pinLabel||('اليوم '+Math.round(day)); const done=seg(lt,x.at+0.5+(it.dur||3),x.at+0.9+(it.dur||3)); e.querySelector('.fr').style.background= done>0?'linear-gradient(270deg,#ff4d6a,#ff9f43 60%,#22c55e)':''; const okk=e.querySelector('.ok'); okk.style.opacity=ease(done); okk.style.transform=`scale(${0.8+0.2*back(done)})`; }
      if(it.type==='tiles' && it.scan!=null){ x.kids.forEach((c,i)=>{ const a=it.scan+i*0.16; const g=seg(lt,a,a+0.15)*(1-seg(lt,a+0.3,a+0.6)); c.style.borderColor=g>0?`rgba(245,197,66,${0.35+0.65*g})`:''; c.style.boxShadow=g>0?`0 0 ${40*g}px rgba(245,197,66,${0.6*g})`:''; }); }
      if(it.type==='race'){ raceUpdate(x,lt); }
      if(it.type==='cta'){ e.style.opacity=ease(seg(lt,0,0.6)); const sw=seg(lt,0,3); const nd=e.querySelector('.needle'); if(nd) nd.style.transform=`rotate(${-40*Math.exp(-3*sw)*Math.cos(sw*14)}deg)`; const b=e.querySelector('.btn'); b.style.transform=`scale(${1+0.035*Math.sin(t*5)*seg(lt,1,9)})`; }
      if(it.shake){ e.style.transform+=` translateX(${Math.sin(t*36)*it.shake*seg(lt,x.at+0.4,x.at+0.8)}px)`; }
    });
  });
  const BG=document.getElementById('badge'); if(V.badge){ if(!BG.innerHTML) BG.innerHTML='<span>'+V.badge+'</span>'; BG.style.opacity=clamp(t/0.4)*(1-seg(t,SC[SC.length-1].a-0.3,SC[SC.length-1].a)); }
  document.getElementById('tint').style.background=`radial-gradient(ellipse at 50% 30%, ${TINT[tint]||TINT.none}, transparent 75%)`;
  const D=document.getElementById('disc'); D.textContent=discT; D.style.opacity=disc;
  document.body.style.opacity=clamp((DUR-t)/0.3);
};
window.DUR=DUR; window.CUTS=SC.map(s=>s.a).filter(a=>a>0); window.HITS=SC.flatMap(s=>s.items.filter(x=>x.it.slam||x.it.type==='counter'||x.it.strike!=null).flatMap(x=>{const r=[]; if(x.it.slam) r.push(s.a+x.at); if(x.it.type==='counter') r.push(s.a+x.at+0.15+(x.it.dur||0)); if(x.it.strike!=null) r.push(s.a+x.it.strike); return r;})); window.TICKS=SC.flatMap(s=>s.items.flatMap(x=>x.it.type==='phone'?x.it.notifs.map(n=>s.a+n.at):[]));
window.CUES=SC.map(s=>s.a).concat(SC.flatMap(s=>s.items.flatMap(x=>{ if(x.times) return x.times.map(a=>s.a+a); if(x.kids) return x.kids.map((_,i)=>s.a+x.at+i*x.step); return [s.a+x.at]; })));
document.fonts.ready.then(()=>{ window.READY=true; render(0); });
</script>
